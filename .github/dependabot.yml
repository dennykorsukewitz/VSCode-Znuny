version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "sunday"
    assignees:
      - "dennykorsukewitz"
    reviewers:
      - "dennykorsukewitz"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "sunday"
    assignees:
      - "dennykorsukewitz"
    reviewers:
      - "dennykorsukewitz"
    ignore:
      # typescript-eslint@8 peer: typescript >=4.8.4 <6.1.0
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]